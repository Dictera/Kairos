name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a  # v6
        with:
          version: 11.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          if [ -f scripts/docx-pipeline/requirements-lock.txt ]; then
            pip install --require-hashes -r scripts/docx-pipeline/requirements-lock.txt
          else
            pip install -r scripts/docx-pipeline/requirements.txt
          fi

      - name: Generate test fixtures
        run: python scripts/create-fragmented-fixture.py

      - name: Test
        run: pnpm test

  security-scan:
    runs-on: ubuntu-latest
    name: Supply Chain Security Scan

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a  # v6
        with:
          version: 11.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high
